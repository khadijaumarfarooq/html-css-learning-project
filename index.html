<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stylish Image Border Changer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Stylish Image Border Changer</h1>

    <div class="image-grid">
      <div class="image-box">
        <img src="image-1.jpg" alt="Image 1" class="myImage" />
        <p>Image One</p>
      </div>

      <div class="image-box">
        <img src="image-3.jpg" alt="Image 2" class="myImage" />
        <p>Image Two</p>
      </div>

      <div class="image-box">
        <img src="image-4.jpg" alt="Image 3" class="myImage" />
        <p>Image Three</p>
      </div>

      <div class="image-box">
        <img src="image-5.jpg" alt="Image 4" class="myImage" />
        <p>Image Four</p>
      </div>
    </div>

    <button id="changeBorderBtn">Change Borders</button>
  </div>

  <script src="task.js"></script>
</body>
</html>
